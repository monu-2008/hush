<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hush</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 360px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0a1f; color: #f5f3ff; padding: 14px; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #7c3aed, #ec4899, #06b6d4); display: grid; place-items: center; font-weight: 700; color: #fff; }
    .brand { font-size: 18px; font-weight: 600; }
    .brand .dot { color: #a78bfa; }
    .sub { font-size: 11px; color: #a78bfa; margin-bottom: 12px; }
    textarea { width: 100%; height: 80px; padding: 8px; border-radius: 8px; border: 1px solid #312e5c; background: #1a1430; color: #f5f3ff; font: inherit; font-size: 13px; resize: none; }
    input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #312e5c; background: #1a1430; color: #f5f3ff; font: inherit; font-size: 13px; margin-top: 8px; }
    label { font-size: 11px; color: #a78bfa; margin-top: 10px; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    button { width: 100%; margin-top: 12px; padding: 10px; border-radius: 8px; border: 0; background: linear-gradient(135deg, #7c3aed, #ec4899); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    .result { margin-top: 12px; padding: 10px; background: #1a1430; border-radius: 8px; border: 1px solid #312e5c; font-size: 12px; max-height: 100px; overflow: auto; word-break: break-all; }
    .copy { width: auto; margin-top: 6px; padding: 6px 10px; font-size: 11px; background: #312e5c; }
    .footer { margin-top: 14px; font-size: 10px; color: #71717a; text-align: center; }
    .footer a { color: #a78bfa; text-decoration: none; }
  </style>
</head>
<body>
  <div class="head">
    <div class="logo">h</div>
    <div class="brand">hush<span class="dot">.</span></div>
  </div>
  <div class="sub">✳ AQERIONX · Private emoji &amp; image messages</div>

  <label for="msg">Message</label>
  <textarea id="msg" placeholder="Write something only they should read…"></textarea>

  <label for="pw">Password (min 8 chars)</label>
  <input id="pw" type="password" placeholder="At least 8 characters" />

  <label for="emoji">Emoji</label>
  <input id="emoji" type="text" value="😊" maxlength="24" />

  <button id="enc">Encrypt &amp; make emoji</button>

  <div id="out" class="result" style="display:none;"></div>
  <button id="copy" class="copy" style="display:none;">Copy emoji for chat</button>

  <div class="footer">
    Client-side AES-256-GCM. Open <a href="https://hush.aqerionx.in" target="_blank">hush.aqerionx.in</a> for full features.
  </div>

  <script src="popup.js"></script>
</body>
</html>
